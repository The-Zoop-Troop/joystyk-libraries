# A reviewed candidate is staged; the owner publishes it by approving on npm with 2FA.
# Configure the public source and publishers first: docs/RELEASING.md.
name: npm release

on:
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == vars.NPM_RELEASE_REPOSITORY && vars.NPM_PUBLISHERS_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check

  stage:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      NPM_RELEASE_REPOSITORY: ${{ vars.NPM_RELEASE_REPOSITORY }}
      NPM_PUBLISHERS_READY: ${{ vars.NPM_PUBLISHERS_READY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:release --artifact-dir "$RUNNER_TEMP/joystyk-npm"
      - name: Stage validated tarballs with OIDC
        run: pnpm release:stage --stage --artifact-dir "$RUNNER_TEMP/joystyk-npm"
      - name: Retain verified release tarballs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joystyk-npm-${{ github.sha }}
          path: |
            ${{ runner.temp }}/joystyk-npm
            ${{ runner.temp }}/joystyk-npm-receipt.json
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0
      - name: Record staging outcome
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/joystyk-npm-receipt.json" ]; then
            cat "$RUNNER_TEMP/joystyk-npm-receipt.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Staged versions require separate owner approval on npm. No release tags or live publication are implied.' >> "$GITHUB_STEP_SUMMARY"
